[project]
name = "assetx-backend"
version = "1.0.0"
description = "AssetX multi-chain portfolio tracker API"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.163.0",
    "uvicorn[standard]==0.54.0",
    "httpx==0.28.1",
    "pydantic==2.14.3",
    "pydantic-settings==2.16.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
filterwarnings = [
    "ignore::DeprecationWarning",
]
